{% extends "base.html" %}
{% block title %}Login — AchieveHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-form p-4">
      <h3 class="mb-3">Welcome back</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">
        Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
      </p>
      <p class="text-center small text-muted mt-2 mb-0">
        Demo admin login — email: <code>admin</code>&#64;<code>college.edu</code> &middot; password: <code>admin123</code>
      </p>
    </div>
  </div>
</div>
{% endblock %}
