{% extends "base.html" %}
{% block title %}Sign Up — AchieveHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-form p-4">
      <h3 class="mb-3">Create your student account</h3>
      <form method="post">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required autofocus>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" placeholder="e.g. Computer Engineering">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Roll No.</label>
            <input type="text" name="roll_no" class="form-control">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required minlength="4">
        </div>
        <button type="submit" class="btn btn-brand w-100">Create Account</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">
        Already registered? <a href="{{ url_for('login') }}">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
